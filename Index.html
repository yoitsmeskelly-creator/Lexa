<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexa</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #111;
            text-align: center;
        }

        .container {
            margin-top: 18vh;
            padding: 20px;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 35px;
        }

        .search-box {
            width: 90%;
            max-width: 650px;
            height: 48px;
            border: 1px solid #ccc;
            border-radius: 25px;
            padding: 0 20px;
            font-size: 17px;
            outline: none;
        }

        button {
            margin-top: 18px;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            background: #111;
            color: white;
            font-size: 16px;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Lexa</h1>

        <form action="https://www.google.com/search" method="GET">
            <input
                class="search-box"
                type="text"
                name="q"
                placeholder="Search Lexa..."
                required
            >

            <br>

            <button type="submit">Search</button>
        </form>
    </div>

</body>
</html>
